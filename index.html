<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the canvas reach the screen edges; the HUD and UI keep
      clear of the notch using env(safe-area-inset-*).

      Note: `user-scalable=no` is deliberately NOT set. Modern iOS ignores it anyway,
      and disabling zoom outright is an accessibility regression. Accidental zoom
      inside the game is prevented with `touch-action` on the canvas instead.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10141c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="駒場東邦をモチーフにしたスマホ向けミニゲーム集" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Icons. The SVG is listed first and wins wherever it is supported; the PNG is
      there for browsers that do not. Static files are matched before the SPA
      rewrite in vercel.json, so these are served as themselves rather than as
      index.html. All of them are generated - see scripts/generate-icons.mjs.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Home-screen / standalone behaviour on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>KOMATO RUSH</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif; color: #fff">
        このゲームを遊ぶには JavaScript を有効にしてください。
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
